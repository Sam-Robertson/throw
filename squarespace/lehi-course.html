<!--
  Throw Art Studio - Lehi 4-week course checkout
  Paste this whole block into a Squarespace Code Block (or Code Injection) on
  the /lehi-course page. Self-contained: inline styles + script + embedded
  webfont, no build step. Everything is scoped under #throw-preorder so it
  can't collide with Squarespace's CSS.

  This is the "start a 4-week course" checkout, split out of the old combined
  lehi-preorder.html so a customer never has to pick "class vs course" first.
  See squarespace/lehi-drop-in.html for the drop-in-class counterpart, and
  src/app/api/preorder/checkout/route.ts for the server-side Stripe session
  this posts to (shared by both files, keyed on the `offering` id below).

  This flow is just one question (which cohort start date) plus contact info
  and review, so it doesn't need the accordion/progressive-disclosure
  treatment the drop-in-class file has -- there's nothing to progressively
  disclose.

  Edit CONFIG below to set real dates, prices, and Stripe Price IDs.

  Font note: GT Alpina (Grilli Type) is embedded below as a self-hosted
  base64 woff2 for the headings. Only the Standard/Regular (400) weight was
  supplied, so heading elements are set to font-weight 400 rather than the
  600 used elsewhere -- confirm the self-hosting license covers this before
  it goes live on a public page.
-->
<div id="throw-preorder">
  <div class="tp-card">
    <div class="tp-header">
      <span class="tp-logo">throw<span class="tp-dot">.</span></span>
      <span class="tp-header-sub">Lehi &mdash; 4 Week Course</span>
    </div>

    <div class="tp-progress" role="progressbar" aria-label="Checkout progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33">
      <div class="tp-progress-fill"></div>
    </div>

    <div class="tp-step-row">
      <button type="button" class="tp-back" aria-label="Go back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5 8l5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <span class="tp-stepnum"></span>
    </div>

    <h2 class="tp-title"></h2>
    <p class="tp-subtitle"></p>

    <div class="tp-error" role="alert" aria-live="assertive" hidden></div>

    <div class="tp-panel" data-step-key="cohort"></div>
    <div class="tp-panel" data-step-key="contact"></div>
    <div class="tp-panel" data-step-key="review"></div>
  </div>

  <p class="tp-footnote">Secure checkout powered by Stripe. Pieces &amp; firings billed separately unless noted.</p>
</div>

  /* ---------- Scoped tokens & reset ---------- */
  #throw-preorder {
    --tp-cream: #F5F0EC;
    --tp-white: #FFFFFF;
    --tp-sage: #8B9D83;
    --tp-sage-hover: #74876C;
    --tp-sage-tint: #EEF1EB;
    --tp-coral: #D56132;
    --tp-ink: #3A2E24;
    --tp-muted: #6F6355;
    --tp-border: #E5DDD3;
    --tp-error: #B3261E;
    --tp-radius-lg: 28px;
    --tp-radius-md: 16px;
    --tp-radius-sm: 12px;
    --tp-font-header: 'GT Alpina', 'Fraunces', Georgia, 'Times New Roman', serif;
    --tp-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    background: var(--tp-cream);
    color: var(--tp-ink);
    font-family: var(--tp-font-sans);
    padding: 32px 16px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  #throw-preorder, #throw-preorder *, #throw-preorder *::before, #throw-preorder *::after {
    box-sizing: border-box;
  }

  #throw-preorder ul, #throw-preorder ol { margin: 0; padding: 0; list-style: none; }
  #throw-preorder p { margin: 0; }
  #throw-preorder button { font: inherit; color: inherit; }
  #throw-preorder .tp-icon { flex: none; display: block; }

  /* ---------- Card shell ---------- */
  #throw-preorder .tp-card {
    width: 100%;
    max-width: 480px;
    background: var(--tp-white);
    border-radius: var(--tp-radius-lg);
    border: 1px solid var(--tp-border);
    box-shadow: 0 1px 2px rgba(58,46,36,0.04), 0 12px 32px rgba(58,46,36,0.06);
    padding: 28px 26px 30px;
  }

  #throw-preorder .tp-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  #throw-preorder .tp-logo {
    font-family: var(--tp-font-header);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--tp-ink);
  }
  #throw-preorder .tp-logo .tp-dot { color: var(--tp-coral); }
  #throw-preorder .tp-header-sub {
    font-size: 12px;
    color: var(--tp-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ---------- Progress bar ---------- */
  #throw-preorder .tp-progress {
    height: 4px;
    width: 100%;
    background: var(--tp-sage-tint);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  #throw-preorder .tp-progress-fill {
    height: 100%;
    width: 33%;
    background: var(--tp-sage);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  /* ---------- Step header row ---------- */
  #throw-preorder .tp-step-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 28px;
    margin-bottom: 4px;
  }
  #throw-preorder .tp-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 4px 6px 4px 2px;
    margin-left: -2px;
    border-radius: var(--tp-radius-sm);
    color: var(--tp-muted);
    font-size: 14px;
    cursor: pointer;
  }
  #throw-preorder .tp-back:hover { color: var(--tp-ink); }
  #throw-preorder .tp-back[hidden] { visibility: hidden; }
  #throw-preorder .tp-stepnum {
    font-size: 12px;
    color: var(--tp-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  #throw-preorder .tp-title {
    font-family: var(--tp-font-header);
    font-weight: 400;
    font-size: 26px;
    line-height: 1.2;
    margin: 6px 0 6px;
  }
  #throw-preorder .tp-subtitle {
    font-size: 14px;
    color: var(--tp-muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }

  #throw-preorder .tp-error {
    background: #FBEAE7;
    border: 1px solid var(--tp-error);
    color: var(--tp-error);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: var(--tp-radius-sm);
    margin-bottom: 16px;
  }

  #throw-preorder .tp-panel { display: none; }
  #throw-preorder .tp-panel.is-active { display: block; }

  /* ---------- Option cards (cohort picker) ---------- */
  #throw-preorder .tp-option-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #throw-preorder .tp-option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--tp-white);
    border: 1.5px solid var(--tp-border);
    border-radius: var(--tp-radius-md);
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }
  #throw-preorder .tp-option:hover { border-color: var(--tp-sage); }
  #throw-preorder .tp-option[aria-checked="true"] {
    border-color: var(--tp-sage);
    background: var(--tp-sage-tint);
  }
  #throw-preorder .tp-option-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  #throw-preorder .tp-option-name {
    font-family: var(--tp-font-header);
    font-weight: 400;
    font-size: 18px;
    color: var(--tp-ink);
  }
  #throw-preorder .tp-option-meta {
    font-size: 13px;
    color: var(--tp-muted);
    margin-top: 8px;
    line-height: 1.45;
  }
  #throw-preorder .tp-option-price {
    font-family: var(--tp-font-header);
    font-weight: 400;
    font-size: 17px;
    color: var(--tp-coral);
    white-space: nowrap;
    text-align: right;
    flex: none;
  }
  #throw-preorder .tp-radio-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--tp-muted);
    flex: none;
    margin-top: 2px;
    position: relative;
  }
  #throw-preorder .tp-option[aria-checked="true"] .tp-radio-dot {
    border-color: var(--tp-sage);
  }
  #throw-preorder .tp-option[aria-checked="true"] .tp-radio-dot::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--tp-sage);
  }

  /* ---------- Buttons ---------- */
  #throw-preorder .tp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
    margin-top: 22px;
  }
  #throw-preorder .tp-btn-primary {
    background: var(--tp-sage);
    color: #fff;
  }
  #throw-preorder .tp-btn-primary:hover:not(:disabled) { background: var(--tp-sage-hover); }
  #throw-preorder .tp-btn-primary:active:not(:disabled) { transform: translateY(1px); }
  #throw-preorder .tp-btn-primary:disabled {
    background: #C9CFC5;
    cursor: not-allowed;
  }
  #throw-preorder .tp-link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--tp-sage);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #throw-preorder .tp-link-btn:hover { color: var(--tp-sage-hover); }

  #throw-preorder .tp-date-field-wrap {
    position: relative;
  }

  #throw-preorder .tp-date-popover {
    position: absolute;
    z-index: 20;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--tp-white);
    border: 1px solid var(--tp-border);
    border-radius: var(--tp-radius-md);
    box-shadow: 0 4px 10px rgba(58,46,36,0.06), 0 16px 32px rgba(58,46,36,0.12);
    padding: 16px;
  }
  #throw-preorder .tp-date-popover[hidden] { display: none; }

  #throw-preorder .tp-calendar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  #throw-preorder .tp-calendar-head-selects {
    display: flex;
    gap: 6px;
    min-width: 0;
  }
  #throw-preorder .tp-cal-select {
    border: 1.5px solid var(--tp-border);
    border-radius: var(--tp-radius-sm);
    background: var(--tp-white);
    color: var(--tp-ink);

  var CAL_NAV_ICON = {

  }

  function parseMmddyyyy(str) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((str || '').trim());
    if (!m) return null;
    var month = Number(m[1]), day = Number(m[2]), year = Number(m[3]);
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    return { year: year, month: month, day: day };
  }

  // A month calendar with prev/next navigation, for the free-typed Birthday
  // field -- a birthday can be any month in any past year.
  function buildBirthdayCalendarHtml(year, month, selectedIso) {
    var firstWeekday = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);

    var todayYear = todayStart.getFullYear();
    var html = '<div class="tp-calendar-head">' +
      '<button type="button" class="tp-calendar-nav" data-cal-nav="-1" aria-label="Previous month">' + navChevron('left') + '</button>' +
      '<span class="tp-calendar-head-selects">' +
        '<select class="tp-cal-select" data-cal-select="month" aria-label="Month">' +
          MONTH_LABELS.map(function (m, i) {
            return '<option value="' + (i + 1) + '"' + (i + 1 === month ? ' selected' : '') + '>' + m + '</option>';
          }).join('') +
        '</select>' +
        '<select class="tp-cal-select" data-cal-select="year" aria-label="Year">' +
          (function () {
            var opts = '';
            for (var y = todayYear; y >= todayYear - 100; y--) {
              opts += '<option value="' + y + '"' + (y === year ? ' selected' : '') + '>' + y + '</option>';
            }
            return opts;
          })() +
        '</select>' +
      '</span>' +
      '<button type="button" class="tp-calendar-nav" data-cal-nav="1" aria-label="Next month">' + navChevron('right') + '</button>' +
      '</div>';
    html += '<div class="tp-calendar-grid">';
    WEEKDAY_LABELS.forEach(function (w) { html += '<div class="tp-calendar-weekday">' + w + '</div>'; });

    for (var i = 0; i < firstWeekday; i++) {
      html += '<button type="button" class="tp-calendar-day tp-calendar-empty" tabindex="-1" disabled></button>';
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var cellDate = new Date(year, month - 1, day);
      var isFuture = cellDate > todayStart;
      var iso = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var pressed = selectedIso === iso;
      html += '<button type="button" class="tp-calendar-day" data-date="' + iso + '"' +
        ' aria-pressed="' + pressed + '"' + (isFuture ? ' disabled' : '') + '>' + day + '</button>';
    }
    html += '</div>';
    return html;
  }

    els.panels.cohort.querySelectorAll('.tp-option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var optionId = btn.getAttribute('data-option');
        state.option = findById(CONFIG.offering.cohorts, optionId);
        els.panels.cohort.querySelectorAll('.tp-option').forEach(function (b) {
          b.setAttribute('aria-checked', b === btn ? 'true' : 'false');

        els.panels.cohort.querySelector('[data-action="continue"]').disabled = false;

    els.panels.cohort.querySelector('[data-action="continue"]').addEventListener('click', function () {
      if (!state.option) return;

      '<button type="button" class="tp-btn tp-btn-primary" data-action="continue">Continue</button>';
    els.panels.contact.innerHTML = html;

    var nameInput = document.getElementById('tp-name');

    function renderBirthdayCalendar() {
      birthdayPopover.innerHTML = buildBirthdayCalendarHtml(birthdayCal.year, birthdayCal.month, birthdaySelectedIso());
      birthdayPopover.querySelectorAll('[data-cal-nav]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var d = new Date(birthdayCal.year, birthdayCal.month - 1 + Number(btn.getAttribute('data-cal-nav')), 1);
          birthdayCal.year = d.getFullYear();
          birthdayCal.month = d.getMonth() + 1;
          renderBirthdayCalendar();
        });
      });
      birthdayPopover.querySelectorAll('[data-cal-select]').forEach(function (sel) {
        sel.addEventListener('click', function (e) { e.stopPropagation(); });
        sel.addEventListener('change', function () {
          if (sel.getAttribute('data-cal-select') === 'month') {
            birthdayCal.month = Number(sel.value);
          } else {
            birthdayCal.year = Number(sel.value);
          }
          renderBirthdayCalendar();
        });
      });
      birthdayPopover.querySelectorAll('.tp-calendar-day:not(.tp-calendar-empty):not(:disabled)').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.getAttribute('data-date').split('-');

          state.birthday = birthdayInput.value;
          closeBirthdayPopover();
        });
      });
    }

      if (!birthdayPopover.hidden) return;
      renderBirthdayCalendar();
      birthdayPopover.hidden = false;
      birthdayTrigger.setAttribute('aria-expanded', 'true');
    }

      birthdayPopover.hidden = true;
      birthdayTrigger.setAttribute('aria-expanded', 'false');
    }

    birthdayTrigger.addEventListener('click', function (e) {

    });
    birthdayInput.addEventListener('focus', openBirthdayPopover);
    birthdayInput.addEventListener('click', openBirthdayPopover);

    els.panels.contact.querySelector('[data-action="continue"]').addEventListener('click', function () {
      state.name = nameInput.value.trim();
      state.email = emailInput.value.trim();
      state.birthday = birthdayInput.value.trim();
      state.phone = phoneInput.value.trim();
      state.smsBooking = smsBookingInput.checked;
      state.smsOffers = smsOffersInput.checked;

      var validName = validateName(state.name);
      var validEmail = validateEmail(state.email);
      var validPhone = validatePhone(state.phone);

      toggleFieldError(nameInput, 'tp-name-error', !validName);
      toggleFieldError(emailInput, 'tp-email-error', !validEmail);
      toggleFieldError(phoneInput, 'tp-phone-error', !validPhone);

      if (!validName || !validEmail || !validPhone) {
        var firstInvalid = !validName ? nameInput : (!validEmail ? emailInput : phoneInput);
        firstInvalid.focus();
        return;
      }
      goNext();
    });

    [nameInput, emailInput, phoneInput].forEach(function (input) {
      input.addEventListener('blur', function () {
        if (input === nameInput) toggleFieldError(input, 'tp-name-error', !validateName(input.value.trim()));
        if (input === emailInput) toggleFieldError(input, 'tp-email-error', !validateEmail(input.value.trim()));
        if (input === phoneInput) toggleFieldError(input, 'tp-phone-error', !validatePhone(input.value.trim()));
      });
    });
  }

  function toggleFieldError(input, errorId, isInvalid) {
    var errEl = document.getElementById(errorId);
    input.setAttribute('aria-invalid', isInvalid ? 'true' : 'false');
    if (errEl) errEl.classList.toggle('is-visible', isInvalid);
  }

  function validateName(v) { return v.length >= 2; }
  function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function validatePhone(v) {
    var digits = v.replace(/\D/g, '');
    return digits.length === 10 || (digits.length === 11 && digits.charAt(0) === '1');
  }

  /* ---------------- Review + submit ---------------- */
  function getSelection() {
    if (!state.option) return null;
    return {
      priceId: state.option.priceId,
      quantity: 1,
      unitPrice: state.option.price,
      total: state.option.price,
      title: state.option.label,
      detail: state.option.meta,
      footnote: ''
    };
  }

  function renderReview() {
    var sel = getSelection();
    if (!sel) { goToIndex(0); return; }

    var itemLine = esc(sel.title);

    var html = '' +
      '<div class="tp-summary">' +
        '<div class="tp-summary-head">' +
          '<div class="tp-summary-title">Your order</div>' +
          '<button type="button" class="tp-link-btn" data-action="edit">Edit</button>' +
        '</div>' +
        '<div class="tp-summary-row">' +
          '<span class="tp-summary-label">' + itemLine + '</span>' +
          '<span class="tp-summary-value">' + formatPrice(sel.total) + '</span>' +
        '</div>' +
        '<div class="tp-summary-sub">' + esc(sel.detail) + '</div>' +
        '<div class="tp-summary-row tp-total">' +
          '<span class="tp-summary-label">Total</span>' +
          '<span class="tp-summary-value">' + formatPrice(sel.total) + '</span>' +
        '</div>' +
        '<div class="tp-summary-sub">Tax, if applicable, is calculated at checkout.</div>' +
      '</div>' +
      '<div class="tp-review-block">' +
        '<div class="tp-review-heading">Contact info</div>' +
        '<div class="tp-review-line">' + esc(state.name) + '</div>' +
        '<div class="tp-review-line">' + esc(state.email) + '</div>' +
        '<div class="tp-review-line">' + esc(state.phone) + '</div>' +
      '</div>' +
      '<p class="tp-review-coupon-hint">Have a coupon code? There&rsquo;s a spot for it on the next (secure Stripe) screen.</p>' +
      '<button type="button" class="tp-btn tp-btn-primary" data-action="submit">Continue to payment</button>';

    els.panels.review.innerHTML = html;
    els.panels.review.querySelector('[data-action="submit"]').addEventListener('click', submitOrder);
    els.panels.review.querySelector('[data-action="edit"]').addEventListener('click', function () {
      goToIndex(0);
    });
  }

  function submitOrder(evt) {
    clearError();
    var sel = getSelection();
    if (!sel) return;
    var btn = evt.currentTarget;
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Redirecting to payment...';

    var payload = {
      widget: 'course',
      offering: CONFIG.offering.id,
      offeringTitle: CONFIG.offering.title,
      priceId: sel.priceId,
      quantity: sel.quantity,
      amount: sel.total,
      selectionLabel: sel.title,
      selectionDetail: sel.detail,
      name: state.name,
      email: state.email,
      birthday: state.birthday,
      phone: state.phone,
      smsBooking: state.smsBooking,
      smsOffers: state.smsOffers
    };

    fetch(CONFIG.checkoutEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Checkout request failed (' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.url) throw new Error('No checkout URL returned');
        window.location.href = data.url;
      })
      .catch(function (err) {
        showError('Something went wrong starting checkout. Please try again. (' + err.message + ')');
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  /* ---------------- Step machine ---------------- */
  var STEP_META = {
    cohort: { title: 'Choose your options', subtitle: 'Pick a cohort start date.' },
    contact: { title: 'Your info', subtitle: 'We\u2019ll send your confirmation here.' },
    review: { title: 'Review &amp; pay', subtitle: 'Double check the details, then head to secure checkout.' }
  };

  var STEP_RENDERERS = {
    cohort: renderCohort,
    contact: renderContact,
    review: renderReview
  };

  function render() {
    clearError();
    var key = STEPS[state.stepIndex];

    Object.keys(els.panels).forEach(function (panelKey) {
      els.panels[panelKey].classList.toggle('is-active', panelKey === key);
    });

    var meta = STEP_META[key];
    els.title.innerHTML = meta.title;
    els.subtitle.innerHTML = meta.subtitle;
    els.stepnum.textContent = 'Step ' + (state.stepIndex + 1) + ' / ' + STEPS.length;
    els.back.hidden = state.stepIndex === 0;
    var pct = (state.stepIndex + 1) / STEPS.length * 100;
    els.progressFill.style.width = pct + '%';
    els.progress.setAttribute('aria-valuenow', String(Math.round(pct)));

    STEP_RENDERERS[key]();

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    root.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  function goToIndex(index) {
    state.stepIndex = index;
    render();
  }

  function goNext() {
    state.stepIndex = Math.min(state.stepIndex + 1, STEPS.length - 1);
    render();
  }

  els.back.addEventListener('click', function () {
    if (state.stepIndex > 0) {
      state.stepIndex -= 1;
      render();
    }
  });

  // Closes the birthday date popover on an outside click / Escape. Defined
  // once here (rather than inside renderContact) so re-rendering that step
  // doesn't stack up duplicate document-level listeners.
  document.addEventListener('click', function (e) {
    var popover = document.getElementById('tp-birthday-popover');
    if (!popover || popover.hidden) return;
    var trigger = document.getElementById('tp-birthday-trigger');
    var input = document.getElementById('tp-birthday');
    if (popover.contains(e.target) || (trigger && trigger.contains(e.target)) || (input && input.contains(e.target))) return;
    popover.hidden = true;
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var popover = document.getElementById('tp-birthday-popover');
    if (!popover || popover.hidden) return;
    popover.hidden = true;
    var trigger = document.getElementById('tp-birthday-trigger');
    if (trigger) { trigger.setAttribute('aria-expanded', 'false'); trigger.focus(); }
  });

  // Stripe's success_url points back at this same embedded page with
  // ?status=success rather than straight at the homepage, so there's a
  // moment to confirm the booking actually went through before handing the
  // customer off. cancel_url skips this entirely and goes back to this
  // page directly (set server-side in src/app/api/preorder/checkout/route.ts).
  var HOME_URL = 'https://www.throwartstudio.com/';
  var SUCCESS_REDIRECT_DELAY_MS = 6000;

  function renderSuccessCard() {
    var card = root.querySelector('.tp-card');
    card.innerHTML = '' +
      '<div class="tp-header"><span class="tp-logo">throw<span class="tp-dot">.</span></span></div>' +
      '<div class="tp-success">' +
        '<div class="tp-success-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5l2.5 2.5 5.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h2 class="tp-title">You&rsquo;re all set</h2>' +
        '<p class="tp-subtitle">Your booking went through and a confirmation email is on its way. Taking you back to throwartstudio.com&hellip;</p>' +
        '<a class="tp-btn tp-btn-primary" href="' + HOME_URL + '">Return to homepage now</a>' +
      '</div>';

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      setTimeout(function () { window.location.href = HOME_URL; }, SUCCESS_REDIRECT_DELAY_MS);
    }
  }

  function showingSuccessRedirect() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('status') !== 'success') return false;
    renderSuccessCard();
    return true;
  }

  if (!showingSuccessRedirect()) {
    render();
  }
})();
</script>
