  var WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function buildCalendarHtml(year, month) {
    var firstWeekday = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);

    WEEKDAY_LABELS.forEach(function (w) { html += '<div class="tp-calendar-weekday">' + w + '</div>'; });

    for (var i = 0; i < firstWeekday; i++) {
      html += '<button type="button" class="tp-calendar-day tp-calendar-empty" tabindex="-1" disabled></button>';
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var cellDate = new Date(year, month - 1, day);
      var isPast = cellDate < todayStart;
      var iso = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var pressed = state.date === iso;
      html += '<button type="button" class="tp-calendar-day" data-date="' + iso + '"' +
        ' aria-pressed="' + pressed + '"' + (isPast ? ' disabled' : '') + '>' + day + '</button>';
    }
    html += '</div>';
    return html;
  }

  var CAL_NAV_ICON = {

  function parseMmddyyyy(str) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((str || '').trim());
    if (!m) return null;
    var month = Number(m[1]), day = Number(m[2]), year = Number(m[3]);
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    return { year: year, month: month, day: day };
  }

  // A month calendar with prev/next navigation, for the free-typed Birthday
  // field -- unlike the class-booking calendar (locked to one configured
  // month), a birthday can be any month in any past year.
  function buildBirthdayCalendarHtml(year, month, selectedIso) {
    var firstWeekday = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();
    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);

      '<span>' + esc(MONTH_LABELS[month - 1]) + ' ' + year + '</span>' +
      '<button type="button" class="tp-calendar-nav" data-cal-nav="1" aria-label="Next month">' + navChevron('right') + '</button>' +
      '</div>';
    html += '<div class="tp-calendar-grid">';
    WEEKDAY_LABELS.forEach(function (w) { html += '<div class="tp-calendar-weekday">' + w + '</div>'; });

    for (var i = 0; i < firstWeekday; i++) {

    }

  function renderWheelPicker(range) {
    var pricePerWheel = state.offering.pricePerWheel;
    if (range.mode === 'radio') {

        html += '' +

            '<div class="tp-option-top">' +
              '<div class="tp-radio-dot" aria-hidden="true"></div>' +

              '<div class="tp-option-price">' + formatPrice(pricePerWheel * w) + '</div>' +
            '</div>' +
          '</button>';
      });
      html += '</div>';
      return html;
    }

    // stepper (3+ people)
    var wheels = state.wheels || range.def;
    return '' +
      '<div class="tp-stepper">' +
        '<button type="button" class="tp-stepper-btn" data-wheel-step="-1" aria-label="Fewer wheels"' + (wheels <= range.min ? ' disabled' : '') + '>-</button>' +
        '<div class="tp-stepper-value"><strong>' + wheels + (wheels === 1 ? ' wheel' : ' wheels') + '</strong><span>' + formatPrice(pricePerWheel * wheels) + '</span></div>' +
        '<button type="button" class="tp-stepper-btn" data-wheel-step="1" aria-label="More wheels"' + (wheels >= range.max ? ' disabled' : '') + '>+</button>' +
      '</div>' +
      '<p class="tp-hint">Sharing a wheel? Up to 2 people per wheel.</p>';
  }

  function wireOptionsEvents(offering) {
    var panel = els.panels.options;

    function refreshContinue() {
      panel.querySelector('[data-action="continue"]').disabled = !(state.people && state.date && state.time);
    }

    function reveal(sectionId) {
      var section = document.getElementById(sectionId);
      if (!section || !section.classList.contains('tp-field-section--locked')) return;
      section.classList.remove('tp-field-section--locked');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      section.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }

    function rerenderWheelsSection() {
      var section = document.getElementById('tp-wheels-section');
      var range = wheelRangeFor(state.people);
      if (range.mode === 'none') {
        if (section) section.remove();
        return;
      }
      var html = '<div class="tp-section-label">' + icon('wheel') + ' Number of wheels</div>' + renderWheelPicker(range);
      if (section) {
        section.innerHTML = html;
      } else {
        section = document.createElement('div');
        section.className = 'tp-field-section';
        section.id = 'tp-wheels-section';
        section.innerHTML = html;
        panel.insertBefore(section, panel.querySelectorAll('.tp-field-section')[1].nextSibling);
      }
      wireWheelEvents();
    }

    function wireWheelEvents() {
      panel.querySelectorAll('[data-wheels]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.wheels = Number(btn.getAttribute('data-wheels'));
          panel.querySelectorAll('[data-wheels]').forEach(function (b) {
            b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
          });
        });
      });
      panel.querySelectorAll('[data-wheel-step]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var range = wheelRangeFor(state.people);
          var delta = Number(btn.getAttribute('data-wheel-step'));
          state.wheels = Math.max(range.min, Math.min(range.max, (state.wheels || range.def) + delta));
          rerenderWheelsSection();
        });
      });
    }

    panel.querySelectorAll('[data-people]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.people = Number(btn.getAttribute('data-people'));
        panel.querySelectorAll('[data-people]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-people')) === state.people));
        });
        var range = wheelRangeFor(state.people);
        state.wheels = range.def;
        rerenderWheelsSection();
        reveal('tp-date-section');
        refreshContinue();
      });
    });

    wireWheelEvents();

    panel.querySelectorAll('.tp-calendar-day:not(.tp-calendar-empty)').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.date = btn.getAttribute('data-date');
        var d = new Date(state.date + 'T00:00:00');
        state.dateLabel = WEEKDAY_LABELS[d.getDay()] + ', ' + MONTH_LABELS[d.getMonth()] + ' ' + d.getDate();

          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        reveal('tp-time-section');
        refreshContinue();
      });
    });

    panel.querySelectorAll('[data-time]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.time = btn.getAttribute('data-time');
        panel.querySelectorAll('[data-time]').forEach(function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        refreshContinue();
      });
    });

    panel.querySelector('[data-action="continue"]').addEventListener('click', function () {
      if (!state.people || !state.date || !state.time) return;
      goNext();
    });
  }

  /* ---------------- Contact info ---------------- */

      '<div class="tp-field">' +
        '<label class="tp-label" for="tp-name">Full name</label>' +
        '<input class="tp-input" type="text" id="tp-name" name="name" autocomplete="name" placeholder="Jane Potter" value="' + esc(state.name) + '">' +
        '<div class="tp-field-error" id="tp-name-error">Please enter your name.</div>' +
      '</div>' +
      '<div class="tp-field">' +
        '<label class="tp-label" for="tp-email">Email</label>' +
        '<input class="tp-input" type="email" id="tp-email" name="email" autocomplete="email" placeholder="jane@email.com" value="' + esc(state.email) + '">' +
        '<div class="tp-field-error" id="tp-email-error">Please enter a valid email address.</div>' +
      '</div>' +
      '<div class="tp-field">' +
        '<label class="tp-label" for="tp-birthday">Birthday <span class="tp-optional">(optional)</span></label>' +
        '<div class="tp-date-field-wrap">' +
          '<input class="tp-input tp-input--with-icon" type="text" id="tp-birthday" name="birthday" placeholder="MM/DD/YYYY" autocomplete="off" inputmode="numeric" value="' + esc(state.birthday) + '">' +
          '<button type="button" class="tp-date-field-icon-btn" id="tp-birthday-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="tp-birthday-popover" aria-label="Choose birthday from calendar">' + icon('calendar', 17) + '</button>' +
          '<div class="tp-date-popover" id="tp-birthday-popover" role="dialog" aria-label="Choose your birthday" hidden></div>' +
        '</div>' +
      '</div>' +
      '<div class="tp-field">' +
        '<label class="tp-label" for="tp-phone">Mobile number</label>' +
        '<input class="tp-input" type="tel" id="tp-phone" name="phone" autocomplete="tel" placeholder="(801) 555-0100" value="' + esc(state.phone) + '">' +
        '<div class="tp-field-error" id="tp-phone-error">Please enter a valid 10-digit mobile number.</div>' +
      '</div>' +
      '<label class="tp-checkbox-row" for="tp-sms-booking">' +
        '<input type="checkbox" id="tp-sms-booking" name="smsBooking"' + (state.smsBooking ? ' checked' : '') + '>' +
        '<span>Text me booking updates from ' + esc(CONFIG.studio.smsBrand) + ' \u2014 ' + esc(CONFIG.location.active) + '. Msg &amp; data rates may apply. Msg frequency varies. Reply HELP for help, STOP to cancel.</span>' +
      '</label>' +
      '<label class="tp-checkbox-row" for="tp-sms-offers">' +
        '<input type="checkbox" id="tp-sms-offers" name="smsOffers"' + (state.smsOffers ? ' checked' : '') + '>' +
        '<span>Text me offers &amp; news from ' + esc(CONFIG.studio.smsBrand) + ' \u2014 ' + esc(CONFIG.location.active) + '. Msg &amp; data rates may apply. Msg frequency varies. Reply HELP for help, STOP to cancel.</span>' +
      '</label>' +
      '<button type="button" class="tp-btn tp-btn-primary" data-action="continue">Continue</button>';
    els.panels.contact.innerHTML = html;

    var nameInput = document.getElementById('tp-name');
    var emailInput = document.getElementById('tp-email');
    var birthdayInput = document.getElementById('tp-birthday');
    var birthdayTrigger = document.getElementById('tp-birthday-trigger');
    var birthdayPopover = document.getElementById('tp-birthday-popover');
    var phoneInput = document.getElementById('tp-phone');
    var smsBookingInput = document.getElementById('tp-sms-booking');
    var smsOffersInput = document.getElementById('tp-sms-offers');

    var today = new Date();
    var parsedBirthday = parseMmddyyyy(state.birthday);
    var birthdayCal = parsedBirthday
      ? { year: parsedBirthday.year, month: parsedBirthday.month }
      : { year: today.getFullYear() - 25, month: today.getMonth() + 1 };

    function birthdaySelectedIso() {
      var parsed = parseMmddyyyy(birthdayInput.value);
      if (!parsed) return null;
      return parsed.year + '-' + String(parsed.month).padStart(2, '0') + '-' + String(parsed.day).padStart(2, '0');
    }

    function renderBirthdayCalendar() {
      birthdayPopover.innerHTML = buildBirthdayCalendarHtml(birthdayCal.year, birthdayCal.month, birthdaySelectedIso());
      birthdayPopover.querySelectorAll('[data-cal-nav]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var d = new Date(birthdayCal.year, birthdayCal.month - 1 + Number(btn.getAttribute('data-cal-nav')), 1);
          birthdayCal.year = d.getFullYear();
          birthdayCal.month = d.getMonth() + 1;
          renderBirthdayCalendar();
        });
      });
      birthdayPopover.querySelectorAll('.tp-calendar-day:not(.tp-calendar-empty):not(:disabled)').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.getAttribute('data-date').split('-');
          birthdayInput.value = parts[1] + '/' + parts[2] + '/' + parts[0];
          state.birthday = birthdayInput.value;
          closeBirthdayPopover();
        });
      });
    }

    function openBirthdayPopover() {
      if (!birthdayPopover.hidden) return;
      renderBirthdayCalendar();
      birthdayPopover.hidden = false;
      birthdayTrigger.setAttribute('aria-expanded', 'true');
    }
    function closeBirthdayPopover() {
      birthdayPopover.hidden = true;
      birthdayTrigger.setAttribute('aria-expanded', 'false');
    }

    birthdayTrigger.addEventListener('click', function (e) {
      e.stopPropagation();
      if (birthdayPopover.hidden) openBirthdayPopover(); else closeBirthdayPopover();
    });
    birthdayInput.addEventListener('focus', openBirthdayPopover);
    birthdayInput.addEventListener('click', openBirthdayPopover);

    els.panels.contact.querySelector('[data-action="continue"]').addEventListener('click', function () {
      state.name = nameInput.value.trim();
      state.email = emailInput.value.trim();
      state.birthday = birthdayInput.value.trim();
      state.phone = phoneInput.value.trim();
      state.smsBooking = smsBookingInput.checked;
      state.smsOffers = smsOffersInput.checked;

      var validName = validateName(state.name);
      var validEmail = validateEmail(state.email);
      var validPhone = validatePhone(state.phone);

      toggleFieldError(nameInput, 'tp-name-error', !validName);
      toggleFieldError(emailInput, 'tp-email-error', !validEmail);
      toggleFieldError(phoneInput, 'tp-phone-error', !validPhone);

      if (!validName || !validEmail || !validPhone) {
        var firstInvalid = !validName ? nameInput : (!validEmail ? emailInput : phoneInput);
        firstInvalid.focus();
        return;
      }
      goNext();
    });

    [nameInput, emailInput, phoneInput].forEach(function (input) {
      input.addEventListener('blur', function () {
        if (input === nameInput) toggleFieldError(input, 'tp-name-error', !validateName(input.value.trim()));
        if (input === emailInput) toggleFieldError(input, 'tp-email-error', !validateEmail(input.value.trim()));
        if (input === phoneInput) toggleFieldError(input, 'tp-phone-error', !validatePhone(input.value.trim()));
      });
    });
  }

  function toggleFieldError(input, errorId, isInvalid) {
    var errEl = document.getElementById(errorId);
    input.setAttribute('aria-invalid', isInvalid ? 'true' : 'false');
    if (errEl) errEl.classList.toggle('is-visible', isInvalid);
  }

  function validateName(v) { return v.length >= 2; }
  function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function validatePhone(v) {
    var digits = v.replace(/\D/g, '');
    return digits.length === 10 || (digits.length === 11 && digits.charAt(0) === '1');
  }

  /* ---------------- Review + submit ---------------- */
  // Builds a flow-agnostic description of what's being purchased so the rest
  // of this function (and the payload builder below) doesn't need to branch
  // on state.flow every time it wants a price, quantity, or label.
  function getSelection() {
    if (state.flow === 'classes') {
      if (!state.people || !state.wheels) return null;
      var offering = state.offering;
      return {
        priceId: offering.priceId,
        quantity: state.wheels,
        unitPrice: offering.pricePerWheel,
        total: offering.pricePerWheel * state.wheels,
        title: 'Drop-in class',
        detail: esc(CONFIG.location.active) + ' \u00b7 ' + state.people + (state.people === 1 ? ' person' : ' people') +
          ' \u00b7 ' + state.wheels + (state.wheels === 1 ? ' wheel' : ' wheels') +
          ' \u00b7 ' + state.dateLabel + ' \u00b7 ' + state.time,
        footnote: 'Pieces you keep are $10\u201315 each, paid at pickup.'
      };
    }
    if (!state.option) return null;
    return {
      priceId: state.option.priceId,
      quantity: 1,
      unitPrice: state.option.price,
      total: state.option.price,
      title: state.option.label,
      detail: state.option.meta,
      footnote: ''
    };
  }

  function renderReview() {
    var sel = getSelection();
    if (!state.offering || !sel) { goToIndex(0); return; }
    var editStepIndex = 1; // 'options' or 'cohort' -- both sit at index 1 in their flow

    var itemLine = sel.quantity > 1
      ? esc(sel.title) + ' ' + formatPrice(sel.unitPrice) + ' x ' + sel.quantity
      : esc(sel.title);

    var html = '' +
      '<div class="tp-summary">' +
        '<div class="tp-summary-head">' +
          '<div class="tp-summary-title">Your order</div>' +
          '<button type="button" class="tp-link-btn" data-action="edit">Edit</button>' +
        '</div>' +
        '<div class="tp-summary-row">' +
          '<span class="tp-summary-label">' + itemLine + '</span>' +
          '<span class="tp-summary-value">' + formatPrice(sel.total) + '</span>' +
        '</div>' +
        '<div class="tp-summary-sub">' + sel.detail + '</div>' +
        '<div class="tp-summary-row tp-total">' +
          '<span class="tp-summary-label">Total</span>' +
          '<span class="tp-summary-value">' + formatPrice(sel.total) + '</span>' +
        '</div>' +
        '<div class="tp-summary-sub">Tax, if applicable, is calculated at checkout.</div>' +
        (sel.footnote ? '<div class="tp-summary-sub">*' + esc(sel.footnote) + '</div>' : '') +
      '</div>' +
      '<div class="tp-review-block">' +
        '<div class="tp-review-heading">Contact info</div>' +
        '<div class="tp-review-line">' + esc(state.name) + '</div>' +
        '<div class="tp-review-line">' + esc(state.email) + '</div>' +
        '<div class="tp-review-line">' + esc(state.phone) + '</div>' +
      '</div>' +
      '<button type="button" class="tp-btn tp-btn-primary" data-action="submit">Continue to payment</button>';

    els.panels.review.innerHTML = html;
    els.panels.review.querySelector('[data-action="submit"]').addEventListener('click', submitOrder);
    els.panels.review.querySelector('[data-action="edit"]').addEventListener('click', function () {
      goToIndex(editStepIndex);
    });
  }

  function submitOrder(evt) {
    clearError();
    var sel = getSelection();
    if (!sel) return;
    var btn = evt.currentTarget;
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Redirecting to payment...';

    var payload = {
      offering: state.offering.id,
      offeringTitle: state.offering.title,
      priceId: sel.priceId,
      quantity: sel.quantity,
      amount: sel.total,
      selectionLabel: sel.title,
      selectionDetail: sel.detail,
      name: state.name,
      email: state.email,
      birthday: state.birthday,
      phone: state.phone,
      smsBooking: state.smsBooking,
      smsOffers: state.smsOffers
    };

    fetch(CONFIG.checkoutEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Checkout request failed (' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.url) throw new Error('No checkout URL returned');
        window.location.href = data.url;
      })
      .catch(function (err) {
        showError('Something went wrong starting checkout. Please try again. (' + err.message + ')');
        btn.disabled = false;
        btn.textContent = originalText;
      });
  }

  /* ---------------- Step machine ---------------- */
  var STEP_META = {
    offering: { title: 'Choose your path', subtitle: 'Book a class or start a 4 week course.' },
    options: { title: 'Choose your options', subtitle: 'Pick your headcount, date, and time.' },
    cohort: { title: 'Choose your options', subtitle: 'Pick a cohort start date.' },
    contact: { title: 'Your info', subtitle: 'We\u2019ll send your confirmation here.' },
    review: { title: 'Review &amp; pay', subtitle: 'Double check the details, then head to secure checkout.' }
  };

  var STEP_RENDERERS = {
    offering: renderOffering,
    options: renderOptions,
    cohort: renderCohort,
    contact: renderContact,
    review: renderReview
  };

  function currentSteps() {
    return FLOWS[state.flow];
  }

  function render() {
    clearError();
    var steps = currentSteps();
    var key = steps[state.stepIndex];

    Object.keys(els.panels).forEach(function (panelKey) {
      els.panels[panelKey].classList.toggle('is-active', panelKey === key);
    });

    var meta = STEP_META[key];
    els.title.innerHTML = meta.title;
    els.subtitle.innerHTML = meta.subtitle;
    els.stepnum.textContent = 'Step ' + (state.stepIndex + 1) + ' / ' + steps.length;
    els.back.hidden = state.stepIndex === 0;
    var pct = (state.stepIndex + 1) / steps.length * 100;
    els.progressFill.style.width = pct + '%';
    els.progress.setAttribute('aria-valuenow', String(Math.round(pct)));

    STEP_RENDERERS[key]();

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    root.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  function goToIndex(index) {
    state.stepIndex = index;
    render();
  }

  function goNext() {
    state.stepIndex = Math.min(state.stepIndex + 1, currentSteps().length - 1);
    render();
  }

  els.back.addEventListener('click', function () {
    if (state.stepIndex > 0) {
      state.stepIndex -= 1;
      render();
    }
  });

  // Closes the birthday date popover on an outside click / Escape. Defined
  // once here (rather than inside renderContact) so re-rendering that step
  // doesn't stack up duplicate document-level listeners.
  document.addEventListener('click', function (e) {
    var popover = document.getElementById('tp-birthday-popover');
    if (!popover || popover.hidden) return;
    var trigger = document.getElementById('tp-birthday-trigger');
    var input = document.getElementById('tp-birthday');
    if (popover.contains(e.target) || (trigger && trigger.contains(e.target)) || (input && input.contains(e.target))) return;
    popover.hidden = true;
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var popover = document.getElementById('tp-birthday-popover');
    if (!popover || popover.hidden) return;
    popover.hidden = true;
    var trigger = document.getElementById('tp-birthday-trigger');
    if (trigger) { trigger.setAttribute('aria-expanded', 'false'); trigger.focus(); }
  });

  // Stripe's success_url points back at this same embedded page with
  // ?status=success rather than straight at the homepage, so there's a
  // moment to confirm the booking actually went through before handing the
  // customer off. cancel_url skips this entirely and goes to the homepage
  // directly (set server-side in src/app/api/preorder/checkout/route.ts).
  var HOME_URL = 'https://www.throwartstudio.com/';
  var SUCCESS_REDIRECT_DELAY_MS = 6000;

  function renderSuccessCard() {
    var card = root.querySelector('.tp-card');
    card.innerHTML = '' +
      '<div class="tp-header"><span class="tp-logo">throw<span class="tp-dot">.</span></span></div>' +
      '<div class="tp-success">' +
        '<div class="tp-success-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5l2.5 2.5 5.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h2 class="tp-title">You&rsquo;re all set</h2>' +
        '<p class="tp-subtitle">Your booking went through and a confirmation email is on its way. Taking you back to throwartstudio.com&hellip;</p>' +
        '<a class="tp-btn tp-btn-primary" href="' + HOME_URL + '">Return to homepage now</a>' +
      '</div>';

    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      setTimeout(function () { window.location.href = HOME_URL; }, SUCCESS_REDIRECT_DELAY_MS);
    }
  }

  function showingSuccessRedirect() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('status') !== 'success') return false;
    renderSuccessCard();
    return true;
  }

  if (!showingSuccessRedirect()) {
    render();
  }
})();
</script>
